server {
    listen 8080;
    root /usr/share/nginx/html;

    location /api/v1/ {
        client_max_body_size 51m;
        proxy_read_timeout 310s;
        proxy_http_version 1.1;
        proxy_pass http://copyright-api:8000;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
