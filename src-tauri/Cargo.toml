[package]
name = "audiotrace"
version = "0.1.0"
description = "Shell Tauri de AudioTrace sobre SoupDB"
authors = ["AudioTrace"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "audiotrace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# El crate se publica como `soupdb-driver`, pero su librería se importa como `rsoup`.
rsoup = { package = "soupdb-driver", path = "../../rsoup" }

[features]
default = []
